name: Auth V2 Founder QA

on:
  workflow_dispatch:
    inputs:
      qa_worker_url:
        description: 'Founder QA Worker URL (must be the auth-v2-qa Worker)'
        required: true
        type: string
      ref:
        description: 'Branch or commit to validate'
        required: true
        default: 'phase5/auth-v2-runtime-api-01'
        type: string

permissions:
  contents: read

jobs:
  auth-v2-founder-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sola_isolated_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      AUTH_V2_QA_WORKER_URL: ${{ inputs.qa_worker_url }}
      AUTH_V2_QA_SUPABASE_URL: https://vlowzglqruozxstiqzgn.supabase.co
      AUTH_V2_QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTH_V2_QA_SUPABASE_SERVICE_ROLE_KEY }}
      AUTH_V2_QA_DEVELOPMENT_OTP: ${{ secrets.AUTH_V2_QA_DEVELOPMENT_OTP }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Require Founder QA secrets
        run: |
          test -n "$AUTH_V2_QA_SUPABASE_SERVICE_ROLE_KEY" || { echo "FOUNDER_MANUAL_SECRET_SETUP_REQUIRED: AUTH_V2_QA_SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$AUTH_V2_QA_DEVELOPMENT_OTP" || { echo "FOUNDER_MANUAL_SECRET_SETUP_REQUIRED: AUTH_V2_QA_DEVELOPMENT_OTP"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "FOUNDER_MANUAL_SECRET_SETUP_REQUIRED: CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Backend typecheck and Auth V2 gates
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: founder-qa-generated-access-secret-${{ github.run_id }}-not-production
          JWT_REFRESH_SECRET: founder-qa-generated-refresh-secret-${{ github.run_id }}-not-production
          AUTH_OTP_HMAC_SECRET: founder-qa-generated-hmac-secret-${{ github.run_id }}-not-production
          ISOLATED_PG_URL: postgresql://postgres:postgrespassword@localhost:5432/sola_isolated_ci_test
        run: |
          npm run check
          npm run test:auth-v2-foundation
          npm run test:auth-v2-postgres
          npm run test:auth-v2-qa-bootstrap
          npm run test:auth-v2-runtime-api-01
          npm run test:auth-v2-worker-adapter
      - name: Bind generated QA-only secrets
        working-directory: backend
        env:
          QA_JWT_ACCESS: founder-qa-generated-access-secret-${{ github.run_id }}-not-production
          QA_JWT_REFRESH: founder-qa-generated-refresh-secret-${{ github.run_id }}-not-production
          QA_HMAC: founder-qa-generated-hmac-secret-${{ github.run_id }}-not-production
        run: |
          set +x
          printf '%s' "$AUTH_V2_QA_SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.auth-v2-qa.json
          printf '%s' "$AUTH_V2_QA_DEVELOPMENT_OTP" | npx wrangler secret put AUTH_DEVELOPMENT_OTP --config wrangler.auth-v2-qa.json
          printf '%s' "$QA_JWT_ACCESS" | npx wrangler secret put JWT_ACCESS_SECRET --config wrangler.auth-v2-qa.json
          printf '%s' "$QA_JWT_REFRESH" | npx wrangler secret put JWT_REFRESH_SECRET --config wrangler.auth-v2-qa.json
          printf '%s' "$QA_HMAC" | npx wrangler secret put AUTH_OTP_HMAC_SECRET --config wrangler.auth-v2-qa.json
      - name: Deploy QA Worker only
        working-directory: backend
        run: npx wrangler deploy --config wrangler.auth-v2-qa.json
      - name: Remote QA acceptance
        working-directory: backend
        run: npm run qa:auth-v2-remote
