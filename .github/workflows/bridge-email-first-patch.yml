name: Bridge Email-First Bounded Patch

on:
  push:
    branches:
      - phase5/customer-auth-v2-email-first
    paths:
      - tools/bridge-email-first-backend-patch.mjs
      - .github/workflows/bridge-email-first-patch.yml

permissions:
  contents: write

jobs:
  apply-bounded-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/customer-auth-v2-email-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact bounded replacements
        run: node tools/bridge-email-first-backend-patch.mjs
      - name: Commit only intended Customer multi-identifier patches
        run: |
          git diff --check
          git diff -- customer-app/src/utils/customerAuthV2.ts customer-app/src/utils/customerAuthV2Flow.ts customer-app/src/components/CustomerAuthScreen09.tsx customer-app/src/components/CustomerAuthScreen10.tsx customer-app/src/App.tsx customer-app/src/utils/customerScreen09AuthV2.test.ts customer-app/src/utils/customerAuthV2Flow.test.ts customer-app/src/utils/customerAuthV2Screen10Contract.test.ts
          git config user.name "KONFRM Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add customer-app/src/utils/customerAuthV2.ts customer-app/src/utils/customerAuthV2Flow.ts customer-app/src/components/CustomerAuthScreen09.tsx customer-app/src/components/CustomerAuthScreen10.tsx customer-app/src/App.tsx customer-app/src/utils/customerScreen09AuthV2.test.ts customer-app/src/utils/customerAuthV2Flow.test.ts customer-app/src/utils/customerAuthV2Screen10Contract.test.ts
          git commit -m "feat(customer): make email and phone equal Auth V2 identifiers"
          git push origin HEAD:phase5/customer-auth-v2-email-first
