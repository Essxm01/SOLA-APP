name: Bridge Email-First Bounded Patch

on:
  push:
    branches:
      - phase5/customer-auth-v2-email-first
    paths:
      - tools/bridge-email-first-backend-patch.mjs
      - .github/workflows/bridge-email-first-patch.yml

permissions:
  contents: write

jobs:
  apply-bounded-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/customer-auth-v2-email-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact bounded replacements
        run: node tools/bridge-email-first-backend-patch.mjs
      - name: Commit only intended backend contract patches
        run: |
          git diff --check
          git diff -- backend/server/src/app.ts backend/server/src/tests/authV2Foundation.test.ts backend/server/src/tests/authV2RuntimeApi01.test.ts
          git config user.name "KONFRM Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add backend/server/src/app.ts backend/server/src/tests/authV2Foundation.test.ts backend/server/src/tests/authV2RuntimeApi01.test.ts
          git commit -m "feat(auth): expose email account creation through Auth V2 API"
          git push origin HEAD:phase5/customer-auth-v2-email-first
