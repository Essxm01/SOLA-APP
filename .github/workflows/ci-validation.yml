name: SOLA Monorepo CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Detect Monorepo Path Changes
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      owner: ${{ steps.filter.outputs.owner }}
      customer: ${{ steps.filter.outputs.customer }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'admin-app/**'
              - '.github/**'
              - 'package.json'
            owner:
              - 'owner-app/**'
              - '.github/**'
              - 'package.json'
            customer:
              - 'customer-app/**'
              - '.github/**'
              - 'package.json'
            backend:
              - 'backend/**'
              - '.github/**'
              - 'package.json'

  # ----------------------------------------------------------------------------
  # JOB 2: Validate Admin App
  # ----------------------------------------------------------------------------
  validate-admin:
    name: Validate Admin App
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Admin App
        run: |
          cd admin-app
          npm ci || npm install
          npm run test:login-security
          npm run test:property-review
          npm run build

  # ----------------------------------------------------------------------------
  # JOB 3: Validate Owner App
  # ----------------------------------------------------------------------------
  validate-owner:
    name: Validate Owner App
    needs: changes
    if: ${{ needs.changes.outputs.owner == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, test & build Owner App
        run: |
          cd owner-app
          npm ci || npm install
          npm run test:home
          npm run build

  # ----------------------------------------------------------------------------
  # JOB 4: Validate Customer App
  # ----------------------------------------------------------------------------
  validate-customer:
    name: Validate Customer App
    needs: changes
    if: ${{ needs.changes.outputs.customer == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Customer App
        run: |
          cd customer-app
          npm ci || npm install
          npm run test:truthful-state
          npm run test:entry-state
          npm run test:search-intent
          npm run test:api
          npm run test:c3
          npm run test:c4
          npm run test:explore-redesign
          npm run test:responsive-hardening
          npm run build

  # ----------------------------------------------------------------------------
  # JOB 5: Validate Backend API
  # ----------------------------------------------------------------------------
  validate-backend:
    name: Validate Backend API
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sola_isolated_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Check Backend
        run: |
          cd backend
          npm ci || npm install
          npm run check
      - name: Run critical Owner registration and identity tests
        env:
          JWT_ACCESS_SECRET: test_ci_jwt_access_secret_only_for_unit_tests_32ch
          JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_only_for_unit_tests_32ch
          AUTH_OTP_HMAC_SECRET: test_ci_hmac_secret_for_auth_v2_unit_tests
          ISOLATED_PG_URL: postgresql://postgres:postgrespassword@localhost:5432/sola_isolated_ci_test
        run: |
          cd backend
          npm run test:auth-v2-foundation
          npm run test:auth-v2-postgres
          npm run test:owner-registration-kyc-01
          npm run test:owner-identity-01
          npm run test:owner-property-wizard-01
          npm run test:p13-property-persistence
          npm run test:p13-property-media
          npm run test:p13-worker-adapter
          npm run test:p13-atomic-media
          npm run test:p12-identity-session
          npm run test:p14-rpc-privileges
          npm run test:booking-01
          npm run test:booking-01-1
          npm run test:p1-4-availability
          npm run test:p1-4-worker-availability
          npm run test:p1-4-migration
          npm run test:p1-5-atomic-booking
          npm run test:p1-6-wallet-ledger
          npm run test:p2-1-public-api
          npm run test:p2-2-renter-api
          npm run test:c4-booking
          npm run test:auth-p02
          npm run test:p2-3-owner-api
          npm run test:r1-admin-security
      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'backend'
