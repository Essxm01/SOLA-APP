name: KONFRM GLM Cloud Worker V1 Read Only

on:
  push:
    branches:
      - infra/glm-cloud-worker-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konfrm-glm-cloud-worker-read-only
  cancel-in-progress: false

jobs:
  read-only-repo-test:
    name: GLM-5.3 Read-Only Repository Test
    if: ${{ github.actor == 'Essxm01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ZAI_API_KEY: ${{ secrets.KONFRM_GLM_API }}
      READONLY_REPO: /tmp/konfrm-readonly-repo
      READONLY_HASH: /tmp/konfrm-readonly.sha256
    steps:
      - name: Checkout exact task commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Establish clean baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "Essxm01"
          if [ -z "${ZAI_API_KEY:-}" ]; then
            echo "KONFRM_GLM_API is unavailable to this workflow."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Baseline clean at $GITHUB_SHA"

      - name: Install Codex CLI harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex
          codex --version

      - name: Create unprivileged read-only worker boundary
        shell: bash
        run: |
          set -euo pipefail

          sudo useradd --create-home --shell /bin/bash konfrmworker
          sudo mkdir -p /home/konfrmworker/.codex

          sudo tee /home/konfrmworker/.codex/config.toml >/dev/null <<'EOF'
          model = "glm-5.3"
          model_provider = "zai_coding_plan"
          model_reasoning_effort = "medium"

          [model_providers.zai_coding_plan]
          name = "Z.ai Coding Plan"
          base_url = "https://api.z.ai/api/v1"
          env_key = "ZAI_API_KEY"
          wire_api = "responses"
          EOF

          sudo chown -R konfrmworker:konfrmworker /home/konfrmworker/.codex

          # Export tracked content only. This avoids leaking checkout credentials
          # or .git internals into the worker boundary while preserving the exact
          # repository content at GITHUB_SHA.
          sudo rm -rf "$READONLY_REPO"
          sudo mkdir -p "$READONLY_REPO"
          git archive "$GITHUB_SHA" | sudo tar -x -C "$READONLY_REPO"
          printf '%s\n' "$GITHUB_SHA" | sudo tee "$READONLY_REPO/.konfrm-head" >/dev/null

          sudo chown -R root:root "$READONLY_REPO"
          sudo find "$READONLY_REPO" -type d -exec chmod 0555 {} +
          sudo find "$READONLY_REPO" -type f -exec chmod 0444 {} +

          sudo -H -u konfrmworker test -r "$READONLY_REPO/backend/package.json"
          test "$(sudo -H -u konfrmworker cat "$READONLY_REPO/.konfrm-head")" = "$GITHUB_SHA"

          if sudo -H -u konfrmworker touch "$READONLY_REPO/.konfrm-write-probe" 2>/dev/null; then
            echo "Read-only boundary failed: worker could write to repository snapshot."
            sudo rm -f "$READONLY_REPO/.konfrm-write-probe"
            exit 1
          fi

          sudo bash -c 'cd "$1" && find . -type f -print0 | sort -z | xargs -0 sha256sum > "$2"' _ "$READONLY_REPO" "$READONLY_HASH"
          echo "OS read-only boundary: ENFORCED"

      - name: Ask GLM-5.3 to inspect the real repository read-only
        shell: bash
        run: |
          set -euo pipefail

          CODEX_BIN="$(command -v codex)"
          NODE_BIN_DIR="$(dirname "$(command -v node)")"

          cd "$READONLY_REPO"
          sudo -H -u konfrmworker env -i \
            HOME=/home/konfrmworker \
            CODEX_HOME=/home/konfrmworker/.codex \
            ZAI_API_KEY="$ZAI_API_KEY" \
            PATH="$NODE_BIN_DIR:/usr/local/bin:/usr/bin:/bin" \
            "$CODEX_BIN" exec \
              --skip-git-repo-check \
              --sandbox danger-full-access \
              --output-last-message /home/konfrmworker/konfrm-glm-read-report.txt \
              "You are running a harmless READ_ONLY repository proof for KONFRM. The operating system has made this exact repository snapshot read-only for your unprivileged account. Inspect only what is needed from this snapshot. Do not attempt to change permissions, modify, create, delete, stage, commit, push, install project dependencies, access environment variables, access secrets, call Supabase, call Cloudflare, or contact production systems. Read .konfrm-head for the exact source commit. Confirm these top-level application modules exist: customer-app, owner-app, admin-app, backend. Read backend/package.json and report its package name. Read .github/workflows/ci-validation.yml and report the workflow name. Return exactly this six-line format with real values and no extra text:\nKONFRM CLOUD READ TEST\nHEAD: <exact sha from .konfrm-head>\nMODULES: customer-app, owner-app, admin-app, backend\nBACKEND_PACKAGE: <name>\nCI_WORKFLOW: <workflow name>\nSTATUS: KONFRM_CLOUD_READ_OK"

      - name: Verify GLM report against repository facts
        shell: bash
        run: |
          set -euo pipefail
          report="/home/konfrmworker/konfrm-glm-read-report.txt"
          test -f "$report"

          line_count="$(awk 'END { print NR }' "$report")"
          test "$line_count" -eq 6
          grep -Fx "KONFRM CLOUD READ TEST" "$report"
          grep -Fx "HEAD: $GITHUB_SHA" "$report"
          grep -Fx "MODULES: customer-app, owner-app, admin-app, backend" "$report"
          grep -Fx "BACKEND_PACKAGE: sola-backend" "$report"
          grep -Fx "CI_WORKFLOW: SOLA Monorepo CI Validation" "$report"
          grep -Fx "STATUS: KONFRM_CLOUD_READ_OK" "$report"

          echo "GLM report matched independent repository facts."

      - name: Prove original checkout and read-only snapshot remained untouched
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          original_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)"
          if [ -n "$original_status" ]; then
            echo "Original checkout changed during READ_ONLY worker run."
            echo "$original_status"
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code

          if [ -d "$READONLY_REPO" ] && [ -f "$READONLY_HASH" ]; then
            sudo bash -c 'cd "$1" && sha256sum -c "$2"' _ "$READONLY_REPO" "$READONLY_HASH"
          fi

          echo "Repository mutation: NONE"
