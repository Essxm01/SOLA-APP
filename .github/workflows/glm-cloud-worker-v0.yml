name: KONFRM GLM Cloud Worker V1 Read Only

on:
  push:
    branches:
      - infra/glm-cloud-worker-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konfrm-glm-cloud-worker-read-only
  cancel-in-progress: false

jobs:
  read-only-repo-test:
    name: GLM-5.3 Read-Only Repository Test
    if: ${{ github.actor == 'Essxm01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ZAI_API_KEY: ${{ secrets.KONFRM_GLM_API }}
      CODEX_HOME: /home/runner/.konfrm-codex
    steps:
      - name: Checkout exact task commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Establish clean read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "Essxm01"
          if [ -z "${ZAI_API_KEY:-}" ]; then
            echo "KONFRM_GLM_API is unavailable to this workflow."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$CODEX_HOME"
          echo "Baseline clean at $GITHUB_SHA"

      - name: Install Codex CLI harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex
          codex --version

      - name: Configure isolated Z.ai GLM worker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$CODEX_HOME/config.toml" <<'EOF'
          model = "glm-5.3"
          model_provider = "zai_coding_plan"
          model_reasoning_effort = "medium"

          [model_providers.zai_coding_plan]
          name = "Z.ai Coding Plan"
          base_url = "https://api.z.ai/api/v1"
          env_key = "ZAI_API_KEY"
          wire_api = "responses"
          EOF

      - name: Ask GLM-5.3 to inspect the real repository read-only
        shell: bash
        run: |
          set -euo pipefail
          codex exec \
            --sandbox read-only \
            --output-last-message "$RUNNER_TEMP/konfrm-glm-read-report.txt" \
            "You are running a harmless READ_ONLY repository proof for KONFRM. Inspect only what is needed from this checked-out repository. Do not modify, create, delete, stage, commit, push, install project dependencies, access environment variables, access secrets, call Supabase, call Cloudflare, or contact production systems. Determine the exact Git HEAD with git rev-parse HEAD. Confirm these top-level application modules exist: customer-app, owner-app, admin-app, backend. Read backend/package.json and report its package name. Read .github/workflows/ci-validation.yml and report the workflow name. Return exactly this six-line format with real values and no extra text:\nKONFRM CLOUD READ TEST\nHEAD: <exact sha>\nMODULES: customer-app, owner-app, admin-app, backend\nBACKEND_PACKAGE: <name>\nCI_WORKFLOW: <workflow name>\nSTATUS: KONFRM_CLOUD_READ_OK"

      - name: Verify GLM report against repository facts
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/konfrm-glm-read-report.txt"
          test -f "$report"

          line_count="$(awk 'END { print NR }' "$report")"
          test "$line_count" -eq 6
          grep -Fx "KONFRM CLOUD READ TEST" "$report"
          grep -Fx "HEAD: $GITHUB_SHA" "$report"
          grep -Fx "MODULES: customer-app, owner-app, admin-app, backend" "$report"
          grep -Fx "BACKEND_PACKAGE: sola-backend" "$report"
          grep -Fx "CI_WORKFLOW: SOLA Monorepo CI Validation" "$report"
          grep -Fx "STATUS: KONFRM_CLOUD_READ_OK" "$report"

          echo "GLM report matched independent repository facts."

      - name: Prove repository remained untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Repository changed during READ_ONLY worker run."
            git status --short
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
          echo "Repository mutation: NONE"
